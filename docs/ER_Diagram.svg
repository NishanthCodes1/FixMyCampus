<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Modern Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="entityHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#f8fafc" rx="16" />

  <!-- Document Header -->
  <rect x="0" y="0" width="900" height="95" fill="url(#headerGrad)" />
  <text x="40" y="45" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">FixMyCampus — Database ER Diagram</text>
  <text x="40" y="72" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#e0e7ff">Database: fixmycampus_db | College Project Documentation</text>
  
  <!-- Entity Box Container -->
  <g filter="url(#shadow)" transform="translate(150, 130)">
    <!-- Main Entity Box Background -->
    <rect width="600" height="520" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Table Header Bar -->
    <rect width="600" height="55" fill="url(#entityHeaderGrad)" rx="12" />
    <!-- Fix rounded bottom corners of header -->
    <rect x="0" y="45" width="600" height="10" fill="#4f46e5" />
    
    <!-- Table Icon and Name -->
    <circle cx="35" cy="27" r="14" fill="rgba(255,255,255,0.2)" />
    <text x="31" y="32" font-family="sans-serif" font-size="14" fill="#ffffff">📊</text>
    <text x="60" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">issues</text>
    <text x="540" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="end">Base Entity Table</text>

    <!-- Table Column Headers -->
    <rect x="0" y="55" width="600" height="32" fill="#f1f5f9" />
    <text x="35" y="76" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">KEY</text>
    <text x="100" y="76" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">COLUMN NAME</text>
    <text x="280" y="76" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">DATA TYPE</text>
    <text x="440" y="76" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">CONSTRAINTS / DEFAULT</text>
    <line x1="0" y1="87" x2="600" y2="87" stroke="#cbd5e1" stroke-width="1" />

    <!-- Column Row 1: id (PK) -->
    <g transform="translate(0, 88)">
      <rect width="600" height="42" fill="#eef2ff" />
      <rect x="30" y="11" width="30" height="20" rx="4" fill="#4f46e5" />
      <text x="35" y="25" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">PK</text>
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="700" fill="#1e1b4b">id</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="600" fill="#4338ca">BIGINT</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#3730a3">NOT NULL, AUTO_INCREMENT</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#e2e8f0" stroke-width="1" />
    </g>

    <!-- Column Row 2: title -->
    <g transform="translate(0, 130)">
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">title</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">VARCHAR(100)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 3: description -->
    <g transform="translate(0, 172)">
      <rect width="600" height="42" fill="#f8fafc" />
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">description</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">TEXT</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 4: location -->
    <g transform="translate(0, 214)">
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">location</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">VARCHAR(255)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 5: category -->
    <g transform="translate(0, 256)">
      <rect width="600" height="42" fill="#f8fafc" />
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">category</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">VARCHAR(100)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 6: priority -->
    <g transform="translate(0, 298)">
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">priority</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">VARCHAR(50)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL, DEFAULT 'LOW'</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 7: status -->
    <g transform="translate(0, 340)">
      <rect width="600" height="42" fill="#f8fafc" />
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">status</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">VARCHAR(50)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL, DEFAULT 'PENDING'</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 8: reported_by -->
    <g transform="translate(0, 382)">
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">reported_by</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">VARCHAR(255)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 9: created_at -->
    <g transform="translate(0, 424)">
      <rect width="600" height="42" fill="#f8fafc" />
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">created_at</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">DATETIME(6)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#64748b">NOT NULL</text>
      <line x1="0" y1="42" x2="600" y2="42" stroke="#f1f5f9" stroke-width="1" />
    </g>

    <!-- Column Row 10: updated_at -->
    <g transform="translate(0, 466)">
      <text x="100" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="600" fill="#0f172a">updated_at</text>
      <text x="280" y="26" font-family="'Consolas', 'Courier New', monospace" font-size="13" fill="#0284c7">DATETIME(6)</text>
      <text x="440" y="26" font-family="sans-serif" font-size="12" fill="#94a3b8">NULLABLE</text>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="450" y="680" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Generated for FixMyCampus Project Documentation &bull; Database: fixmycampus_db</text>
</svg>
